#:schema node_modules/wrangler/config-schema.json
name = "zeecom-solution"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers with Static Assets support (enables direct `wrangler deploy`)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Default Environment Variables (Set GEMINI_API_KEY as an encrypted secret in Cloudflare Dashboard or via `wrangler secret put GEMINI_API_KEY`)
[vars]
ENVIRONMENT = "production"
APP_NAME = "ZEECOM SOLUTION"
APP_URL = "https://zeecomsolution.com"
