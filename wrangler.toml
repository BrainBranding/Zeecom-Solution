#:schema node_modules/wrangler/config-schema.json
name = "zeecom-solution"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages & Static Assets output directory
pages_build_output_dir = "./dist"

# Default Environment Variables (Set GEMINI_API_KEY as an encrypted secret in Cloudflare Dashboard or via `wrangler secret put GEMINI_API_KEY`)
[vars]
ENVIRONMENT = "production"
APP_NAME = "ZEECOM SOLUTION"
APP_URL = "https://zeecomsolution.com"

# When deploying as Cloudflare Worker with static asset serving:
# [assets]
# directory = "./dist"
# binding = "ASSETS"
